<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="295" viewBox="0 0 1280 295" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Ciclo de vida de un paquete</title><desc id="descripcion">Pendiente pasa a En proceso, luego a Revisión y finalmente a Listo. Un rechazo devuelve Revisión a En proceso.</desc><defs><marker id="f" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#9e252d"/></marker></defs><rect width="1280" height="295" rx="12" fill="#f5f5f5"/><g font-family="Arial,sans-serif"><text x="32" y="42" font-size="16" letter-spacing="2" fill="#6b6b6b">TRANSICIONES CONTROLADAS POR EL SERVIDOR</text><g stroke="#d4d4d4" fill="white"><rect x="32" y="85" width="235" height="80" rx="7"/><rect x="357" y="85" width="235" height="80" rx="7"/><rect x="682" y="85" width="235" height="80" rx="7"/><rect x="1007" y="85" width="235" height="80" rx="7"/></g><g text-anchor="middle" font-size="24" font-weight="700" fill="#242833"><text x="149" y="134">Pendiente</text><text x="474" y="134">En proceso</text><text x="799" y="134">Revisión</text><text x="1124" y="134">Listo</text></g><g stroke="#9e252d" stroke-width="2" fill="none" marker-end="url(#f)"><path d="M270 125h79"/><path d="M595 125h79"/><path d="M920 125h79"/><path d="M799 171v54H474v-51"/></g><g font-size="14" text-anchor="middle" fill="#6b6b6b"><text x="311" y="109">Iniciar</text><text x="636" y="109">Enviar</text><text x="961" y="109">Aprobar</text><text x="636" y="251" fill="#9e252d">Rechazar · Motivo opcional e historial persistente</text></g></g></svg>