<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Arquitectura del sistema</title><desc id="descripcion">El navegador ejecuta Angular, que consulta la API Express. La API aplica reglas y persiste documentos en MongoDB. Gemini es un proveedor opcional de solo lectura.</desc><defs><marker id="flecha" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0l8 4-8 4z" fill="#9e252d"/></marker></defs><rect width="1280" height="470" rx="12" fill="#f5f5f5"/><g font-family="Arial,sans-serif"><text x="34" y="42" font-size="16" fill="#6b6b6b" letter-spacing="2">ARQUITECTURA POR RESPONSABILIDADES</text><g fill="white" stroke="#d6d6d6"><rect x="34" y="90" width="260" height="160" rx="8"/><rect x="398" y="90" width="410" height="160" rx="8"/><rect x="912" y="90" width="330" height="160" rx="8"/><rect x="398" y="330" width="410" height="100" rx="8"/></g><g fill="#121212"><text x="60" y="127" font-size="15" fill="#9e252d">PRESENTACIÓN</text><text x="60" y="165" font-size="26" font-weight="700">Angular</text><text x="60" y="198" font-size="17">Navegación y formularios</text><text x="60" y="226" font-size="17">Guía y visualización</text><text x="426" y="127" font-size="15" fill="#9e252d">APLICACIÓN Y DOMINIO</text><text x="426" y="165" font-size="26" font-weight="700">Node.js + Express</text><text x="426" y="198" font-size="17">Validación · Transiciones · Estadísticas</text><text x="426" y="226" font-size="17">Mongoose · Escrituras atómicas</text><text x="940" y="127" font-size="15" fill="#9e252d">PERSISTENCIA</text><text x="940" y="165" font-size="26" font-weight="700">MongoDB</text><text x="940" y="198" font-size="17">Atlas en la demostración pública</text><text x="940" y="226" font-size="17">MongoDB 8.0 en Docker local</text><text x="426" y="366" font-size="21" font-weight="700">Gemini · Integración opcional</text><text x="426" y="397" font-size="16">Desactivada sin clave · Respaldo por reglas</text></g><g stroke="#9e252d" stroke-width="2" fill="none" marker-end="url(#flecha)"><path d="M296 170h97"/><path d="M810 170h97"/><path d="M600 252v69" stroke-dasharray="6 5"/></g><g fill="#6b6b6b" font-size="14"><text x="306" y="152">HTTP/JSON</text><text x="822" y="152">Consultas</text><text x="626" y="294">Solo contexto agregado</text><text x="34" y="292">Producción: Angular y API comparten un servicio y origen HTTP en Render.</text></g></g></svg>