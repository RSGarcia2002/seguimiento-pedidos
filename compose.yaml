services:
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - datos_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  datos_mongo:
